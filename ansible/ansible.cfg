[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
stdout_callback      = yaml
# `changed` counts are the acceptance criterion (A1), so make them easy to read.
display_skipped_hosts = false
retry_files_enabled  = false
interpreter_python   = /usr/bin/python3
private_key_file     = ~/.ssh/personal-infra
forks                = 1

# Left ON deliberately. A fresh Lightsail instance is not in known_hosts, so the
# FIRST run of `make check-ssh` will refuse to connect — that is the control
# working, not a bug. Accept the fingerprint once, having compared it against
# the console output:
#   ssh-keyscan -H "$(terraform -chdir=../terraform output -raw static_ip)" >> ~/.ssh/known_hosts
host_key_checking = true

[ssh_connection]
# One SSH connection per host instead of one per task. Safe here: `requiretty`
# is not set on Ubuntu's sshd, and CIS hardening (harden.yml) does not set it.
pipelining = true
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
