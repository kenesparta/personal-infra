# Single source of truth for the project fan-out (spec §5.3).
#
# Read by BOTH tools — never let either carry its own copy:
#   Terraform   yamldecode(file("${path.module}/../projects.yml"))   -> origin DNS records, CloudFront distributions
#   Ansible     vars_files: ../../projects.yml                       -> Caddy vhosts, Postgres DBs, deploy timers
#
# Ceiling is FOUR services (C3) — RAM-bound at small_3_0, see AD-1. Each entry
# costs ~100 MB resident on a 2 GB host.
#
# Fields:
#   name      identifier: container name, systemd unit, Postgres role
#   hostname  public name; becomes a CloudFront alias (must be covered by the ACM cert)
#   origin    A record -> static IP; Caddy vhost + Let's Encrypt cert (must resolve
#             DIRECTLY to the instance so HTTP-01 can succeed — see AD-8)
#   image     GHCR image, pulled by the systemd timer (AD-10)
#   port      container port Caddy proxies to
#   database  Postgres database + role name

projects:
  - name: blog
    hostname: kenesparta.dev
    origin: origin.kenesparta.dev
    image: ghcr.io/kenesparta/kenespartadev
    port: 3000
    database: blog
    env:
      LEPTOS_SITE_ADDR: "0.0.0.0:3000"
      RUST_LOG: info

  # Budget API — backend of the iOS app (spec §5.3 rev 2.6; formerly the
  # Telegram bot, rev ≤2.5). Secret env (Gemini key, CREDENCIALES_API) lives in
  # vault_project_env.budget; ORIGIN_SECRET is filled from vault_origin_secret
  # via origin_gate_env — the app checks the same X-Origin-Verify header Caddy
  # does. `origin` keeps its old name on purpose: renaming it would burn a new
  # Let's Encrypt cert (G8) for a name no user ever sees.
  - name: budget
    hostname: api.kenesparta.dev
    origin: origin-bot.kenesparta.dev
    image: ghcr.io/kenesparta/budget-bot
    port: 8080
    database: budget
    origin_gate_env: ORIGIN_SECRET
    env:
      HTTP_ADDR: "0.0.0.0:8080"
      TYPST_BIN: typst
