# Single source of truth for the project fan-out (spec §5.3).
#
# Read by BOTH tools — never let either carry its own copy:
#   Terraform   yamldecode(file("${path.module}/../projects.yml"))   -> origin DNS records, CloudFront distributions
#   Ansible     vars_files: ../../projects.yml                       -> Caddy vhosts, Postgres DBs, deploy timers
#
# Ceiling is FOUR services (C3) — RAM-bound at small_3_0, see AD-1. Each entry
# costs ~100 MB resident on a 2 GB host.
#
# Fields:
#   name      identifier: container name, systemd unit, Postgres role
#   image     GHCR image, pulled by the systemd timer (AD-10)
#   database  Postgres database + role name
#
# The ingress set — domain/hostname/origin/port — is OPTIONAL, but only as a
# SET. Give all four or none; site.yml rejects a half-specified entry (spec
# §5.3, rev 2.12; it was three fields before `domain` existed in rev 2.10).
# Omitting them makes the project HEADLESS: no CloudFront distribution, no alias
# records, no origin A record, no Caddy vhost, no Let's Encrypt cert.
#
#   domain    the REGISTERED domain these names live in. Selects the Route 53 zone
#             AND the ACM certificate via local.domains (AD-13). Not derived from
#             `hostname`: a suffix match would silently move records between zones.
#             `hostname` and `origin` must both sit within it — nothing checks
#             this, and the symptom of getting it wrong is NXDOMAIN (G24).
#   hostname  public name; becomes a CloudFront alias (must be covered by `domain`'s cert)
#   origin    A record -> static IP; Caddy vhost + Let's Encrypt cert (must resolve
#             DIRECTLY to the instance so HTTP-01 can succeed — see AD-8)
#   port      container port Caddy proxies to

projects:
  - name: blog
    domain: kenesparta.dev
    hostname: kenesparta.dev
    origin: origin.kenesparta.dev
    image: ghcr.io/kenesparta/kenespartadev
    port: 3000
    database: blog
    env:
      LEPTOS_SITE_ADDR: "0.0.0.0:3000"
      RUST_LOG: info

  # Budget API — backend of the iOS app (spec §5.3 rev 2.6; formerly the
  # Telegram bot, rev ≤2.5). Secret env (Gemini key, CREDENCIALES_API) lives in
  # vault_project_env.budget; ORIGIN_SECRET is filled from vault_origin_secret
  # via origin_gate_env — the app checks the same X-Origin-Verify header Caddy
  # does. `origin` keeps its old name on purpose: renaming it would burn a new
  # Let's Encrypt cert (G8) for a name no user ever sees.
  - name: budget
    domain: kenesparta.dev
    hostname: api.kenesparta.dev
    origin: origin-bot.kenesparta.dev
    image: ghcr.io/kenesparta/budget-bot
    port: 8080
    database: budget
    origin_gate_env: ORIGIN_SECRET
    env:
      HTTP_ADDR: "0.0.0.0:8080"
      TYPST_BIN: typst

  # Discord gateway bot — the first HEADLESS project (spec §5.3 rev 2.10). It
  # opens an outbound WSS connection to Discord and holds it; nothing ever
  # connects TO it, so it has no hostname/origin/port and the whole AD-8 edge
  # chain is absent. Slash commands arrive down the same socket — an HTTP
  # interactions endpoint would buy a certificate and a CloudFront hop to
  # receive events the gateway already delivers.
  #
  # DISCORD_TOKEN lives in vault_project_env.cnayp_discord_bot, never here.
  - name: cnayp_discord_bot
    image: ghcr.io/kenesparta/cnayp-discord-bot
    database: cnayp_discord_bot
    env:
      # LOG_LEVEL, not RUST_LOG: this project is Go (log/slog), unlike blog and
      # budget. It reads DISCORD_TOKEN, DISCORD_GUILD_ID and LOG_LEVEL, and
      # ignores anything else. Accepts debug|info|warn|error.
      LOG_LEVEL: info
      # Scope the slash commands to this one guild instead of registering them
      # globally. The bot serves a single community, and a guild-scoped bulk
      # overwrite takes effect immediately where a global one needs up to an
      # hour to propagate. Quoted because a bare 19-digit scalar is an integer
      # and only the exact digits are a valid snowflake.
      #
      # Not a secret, so it belongs here rather than in the vault: a guild id
      # is visible to every member of that server and grants nothing on its own.
      DISCORD_GUILD_ID: "1461104432530854072"

  # auruming.com — the SECOND registered domain (spec §5.12, AD-13, rev 2.12).
  # Everything public about it is the ordinary AD-8 chain; what is new is that
  # its names resolve in their OWN Route 53 zone and ride their OWN ACM
  # certificate, selected by `domain` below. Terraform reads that field through
  # local.domains; a value naming no known zone fails the plan, a value naming
  # the WRONG known zone applies cleanly and never resolves (G24).
  #
  # Port 3002. Not 3000 (blog holds it, and site.yml asserts ports are unique)
  # and deliberately not 3001, which is Leptos's DEFAULT reload port: the app's
  # shell renders <AutoReload>, so a build that lost LEPTOS_ENV=PROD would ship
  # a live-reload websocket script pointing at reload_port on every page. With
  # site_addr == reload_port that failure reads as the site talking to itself.
  # Nothing publishes this port (acceptance criterion 9) — Caddy upstream only.
  #
  # THIS IS C3's FOURTH AND LAST SLOT. A fifth entry is refused by site.yml, and
  # rightly: ~350 MB OS+Docker + ~400 MB Postgres + ~50 MB Caddy + 4 × ~100 MB is
  # ~1.2 GB of 2 GB (AD-1). Growing needs medium_3_0 on a snapshot.
  #
  # The LEPTOS_* variables the container actually needs (OUTPUT_NAME, SITE_ROOT,
  # SITE_PKG_DIR, ENV) are baked into the image as ENV — they describe the image
  # layout, not the deployment, and getting them wrong serves a blank page with
  # no error. Only the two that are genuinely deployment-facing live here.
  - name: auruming
    domain: auruming.com
    hostname: auruming.com
    origin: origin.auruming.com
    image: ghcr.io/kenesparta/auruming
    port: 3002
    database: auruming
    env:
      LEPTOS_SITE_ADDR: "0.0.0.0:3002"
      RUST_LOG: info
